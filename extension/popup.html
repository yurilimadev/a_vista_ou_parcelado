<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>À Vista ou Parcelado?</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            width: 320px;
            padding: 15px;
            text-align: center;
            background-color: #f9f9f9;
            color: #333;
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 15px;
        }
        .header img {
            width: 24px;
            height: 24px;
        }
        h1 {
            font-size: 18px;
            margin: 0;
        }
        #status {
            font-size: 14px;
            color: #666;
        }
        #resultado {
            font-size: 20px;
            font-weight: bold;
            color: #005fcc;
            margin-top: 12px;
            min-height: 24px; /* Evita que o layout "pule" */
        }
    </style>
</head>
<body>
    <div class="header">
        <!-- O ícone será o mesmo definido no manifest.json -->
        <img src="icon.png" alt="Ícone do App">
        <h1>À Vista ou Parcelado?</h1>
    </div>

    <p id="status">Iniciando análise da página...</p>
    <div id="resultado"></div>

    <!-- O script que controla a mágica -->
    <script src="popup.js"></script>
</body>
</html>
